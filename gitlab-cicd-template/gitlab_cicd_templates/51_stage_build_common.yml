.vue_frontend_build:
  stage: 51_build
  image: node:${NODE_VERSION}-bookworm
  extends: .template_checkout
  script:
    - bash .gitlab-cicd-template/gitlab_cicd_templates/scripts/build/build.sh vue
  artifacts:
    paths:
      - frontend/dist/
      - build-output/
    expire_in: 7 days

