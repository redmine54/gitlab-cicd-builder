.vue_frontend_test:
  stage: 52_test
  image: node:${NODE_VERSION}-bookworm
  extends: .template_checkout
  script:
    - bash .gitlab-cicd-template/gitlab_cicd_templates/scripts/test/test.sh vue
  artifacts:
    when: always
    paths:
      - frontend/coverage/
    expire_in: 7 days

.react_frontend_test:
  stage: 52_test
  image: node:${NODE_VERSION}-bookworm
  extends: .template_checkout
  script:
    - bash .gitlab-cicd-template/gitlab_cicd_templates/scripts/test/test.sh react
  artifacts:
    when: always
    paths:
      - frontend/coverage/
    expire_in: 7 days

.springboot_test:
  stage: 52_test
  image: maven:3.9-eclipse-temurin-21
  extends: .template_checkout
  script:
    - bash .gitlab-cicd-template/gitlab_cicd_templates/scripts/test/test.sh springboot
  artifacts:
    when: always
    paths:
      - backend/target/surefire-reports/
      - backend/target/site/jacoco/
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
    expire_in: 7 days

