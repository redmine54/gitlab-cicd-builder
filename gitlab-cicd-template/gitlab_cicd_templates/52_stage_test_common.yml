.python_test:
  stage: 52_test
  image: python:${PYTHON_VERSION}-slim
  extends: .template_checkout
  script:
    - python -m pip install --no-cache-dir pytest coverage
    - bash .gitlab-cicd-template/gitlab_cicd_templates/scripts/test/test.sh python
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 7 days

